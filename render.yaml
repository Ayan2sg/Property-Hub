# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect your GitHub repo and use "New > Blueprint" to deploy both services + database.

databases:
  - name: prop-haven-db
    plan: free
    databaseName: prophaven
    user: prophaven

services:
  - type: web
    name: prop-haven-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prop-haven-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: prop-haven-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_UPI_ID
        sync: false
      - key: VITE_UPI_PAYEE_NAME
        value: Prop Haven
